name = "reward-app-backend"
main = "cloudflare-worker/src/index.js"
compatibility_date = "2026-03-01"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "test"
API_BASE_URL = "https://api-test.kalametgame.ir"
PRODUCTION_API_URL = "https://api.kalametgame.ir"
SUPABASE_AD_BANNERS_BUCKET = "ad-banners"

[[d1_databases]]
binding = "DB"
database_name = "reward-app-db"
# مقدار واقعی database_id را پس از اجرای `npx wrangler d1 create reward-app-db` یا از داشبورد کلادفلر جایگزین کنید:
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "cloudflare-worker/migrations"

# سرو فایل‌های استاتیک پنل مدیریت (index.html و users.html) بدون نیاز به Express
[assets]
directory = "server/public"
binding = "ASSETS"
run_worker_first = [
  "/api/*",
  "/health",
  "/uploads/*",
  "/admin",
  "/admin/*"
]

# اختیاری ولی توصیه‌شده برای آپلود مستقیم بنرهای تبلیغاتی روی Cloudflare R2:
# [[r2_buckets]]
# binding = "BANNERS_BUCKET"
# bucket_name = "reward-app-banners"

# پس از آماده‌سازی نهایی، مسیر تست زیر را در Cloudflare Dashboard یا wrangler تنظیم کنید:
# routes = [
#   { pattern = "api-test.kalametgame.ir/*", zone_name = "kalametgame.ir" }
# ]
