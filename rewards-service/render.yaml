services:
  - type: web
    name: reqabat-rewards-service
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: ADMIN_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
