<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
  <title>فهرست کاربران واقعی | رقابت کن، جایزه ببر</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Vazirmatn", Tahoma, sans-serif;
      background-color: #0B192C;
      color: #F8FAFC;
      min-height: 100vh;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }
    .page-wrapper {
      width: 100%;
      max-width: 960px;
      margin: 0 auto;
      padding: 12px 10px;
    }
    @media (min-width: 576px) {
      .page-wrapper {
        padding: 24px 20px;
      }
    }
    .header-bar {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 14px;
    }
    @media (min-width: 576px) {
      .header-bar {
        flex-direction: row;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 18px;
      }
    }
    .main-title {
      font-size: 20px;
      color: #FFB703;
      font-weight: 800;
      letter-spacing: -0.3px;
      margin: 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    @media (min-width: 576px) {
      .main-title {
        font-size: 23px;
      }
    }
    .search-wrapper {
      width: 100%;
    }
    @media (min-width: 576px) {
      .search-wrapper {
        width: 280px;
      }
    }
    .form-control-dark {
      background-color: #152A44;
      border: 1px solid #2E5077;
      color: #fff;
      font-size: 13px;
      border-radius: 10px;
      padding: 8px 12px;
      width: 100%;
      height: 40px;
    }
    .form-control-dark:focus {
      background-color: #1E3E62;
      border-color: #FFB703;
      color: #fff;
      box-shadow: 0 0 0 0.2rem rgba(255,183,3,0.25);
    }
    .form-control-dark::placeholder {
      color: #94A3B8;
      font-size: 12.5px;
    }
    .table-card {
      background-color: #1E3E62;
      border: 1px solid #2E5077;
      border-radius: 14px;
      padding: 6px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.35);
      overflow: hidden;
    }
    @media (min-width: 576px) {
      .table-card {
        border-radius: 16px;
        padding: 12px;
      }
    }
    .table-responsive-custom {
      width: 100%;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      margin: 0;
    }
    .users-table {
      width: 100%;
      min-width: 300px;
      margin-bottom: 0;
      border-collapse: separate;
      border-spacing: 0;
      font-size: 13px;
    }
    .users-table th {
      background-color: #152A44;
      color: #94A3B8;
      font-size: 12px;
      font-weight: 700;
      padding: 10px 8px;
      border-bottom: 1px solid #2E5077;
      white-space: nowrap;
      text-align: center;
    }
    .users-table th.th-name {
      text-align: right;
    }
    .users-table td {
      padding: 10px 8px;
      vertical-align: middle;
      border-bottom: 1px solid rgba(46, 80, 119, 0.45);
      color: #F8FAFC;
      line-height: 1.35;
    }
    .users-table tbody tr:last-child td {
      border-bottom: none;
    }
    .users-table tbody tr:hover {
      background-color: rgba(255, 183, 3, 0.05);
    }
    .col-rank {
      width: 50px;
      text-align: center;
      font-weight: 700;
      color: #94A3B8;
      font-size: 13px;
    }
    .col-name {
      text-align: right;
      font-weight: 600;
      font-size: 13px;
      word-break: break-word;
    }
    .col-score {
      width: 120px;
      text-align: center;
    }
    .badge-gold {
      background: linear-gradient(135deg, #FFB703, #FB8500);
      color: #0B192C;
      font-weight: 800;
      padding: 5px 10px;
      border-radius: 12px;
      font-size: 12px;
      display: inline-block;
      white-space: nowrap;
    }
    .rank-top-1 {
      color: #FFD700 !important;
      font-weight: 900;
    }
    .rank-top-2 {
      color: #E2E8F0 !important;
      font-weight: 800;
    }
    .rank-top-3 {
      color: #F59E0B !important;
      font-weight: 800;
    }
  </style>
</head>
<body>

  <div class="page-wrapper">
    <!-- Header with Title and Search -->
    <div class="header-bar">
      <h2 class="main-title">
        <i class="bi bi-trophy-fill text-warning"></i>
        <span>فهرست کاربران واقعی</span>
      </h2>
      <div class="search-wrapper">
        <input type="text" id="userSearchInput" class="form-control-dark" placeholder="جستجو بر اساس نام..." onkeyup="filterUsers()" autocomplete="off">
      </div>
    </div>

    <!-- Alert Box -->
    <div id="alertBox" class="alert alert-danger d-none shadow-sm py-2 px-3 small mb-3" role="alert"></div>

    <!-- Responsive Users Table Card -->
    <div class="table-card">
      <div class="table-responsive-custom">
        <table class="users-table">
          <thead>
            <tr>
              <th scope="col" class="col-rank">#</th>
              <th scope="col" class="th-name">نام و نام خانوادگی</th>
              <th scope="col" class="col-score">مجموع امتیاز</th>
            </tr>
          </thead>
          <tbody id="usersTbody">
            <tr>
              <td colspan="3" class="text-center py-4 text-secondary small">
                <span class="spinner-border spinner-border-sm me-2 text-warning" role="status"></span>
                در حال دریافت اطلاعات از سرور...
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    let cachedUsers = [];

    // Optional query parameter handling (?key=... or ?adminKey=...)
    (function handleUrlKey() {
      try {
        const params = new URLSearchParams(window.location.search);
        const urlKey = params.get('key') || params.get('adminKey');
        if (urlKey && urlKey.trim()) {
          localStorage.setItem('reqabat_admin_key', urlKey.trim());
          const cleanUrl = window.location.pathname;
          window.history.replaceState({}, document.title, cleanUrl);
        }
      } catch (e) {
        console.error('URL parse error:', e);
      }
    })();

    function getSavedKey() {
      return (localStorage.getItem('reqabat_admin_key') || '').trim();
    }

    function showAlert(msg) {
      const el = document.getElementById('alertBox');
      if (el) {
        el.innerText = msg;
        el.classList.remove('d-none');
      }
    }

    function hideAlert() {
      const el = document.getElementById('alertBox');
      if (el) el.classList.add('d-none');
    }

    function sortUsersList(list) {
      return list.sort((a, b) => {
        const scoreA = Number(a.score) || 0;
        const scoreB = Number(b.score) || 0;
        if (scoreB !== scoreA) {
          return scoreB - scoreA;
        }
        const timeA = typeof a.registeredAt === 'number' ? a.registeredAt : (new Date(a.registeredAt || 0).getTime() || 0);
        const timeB = typeof b.registeredAt === 'number' ? b.registeredAt : (new Date(b.registeredAt || 0).getTime() || 0);
        if (timeA !== timeB) {
          return timeA - timeB;
        }
        return String(a.id || '').localeCompare(String(b.id || ''));
      });
    }

    async function loadUsers() {
      hideAlert();

      const headers = {};
      const key = getSavedKey();
      if (key) {
        headers['x-admin-key'] = key;
      }

      try {
        const res = await fetch('/api/admin/users', { headers });

        if (!res.ok) {
          throw new Error('خطا در دریافت اطلاعات از سرور (کد ' + res.status + ')');
        }

        const data = await res.json();
        cachedUsers = sortUsersList(data.users || []);
        renderUsers(cachedUsers);

      } catch (err) {
        console.error('Error loading users:', err);
        showAlert(err.message || 'خطا در ارتباط با سرور.');
      }
    }

    function renderUsers(users) {
      const tbody = document.getElementById('usersTbody');
      if (!users || users.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="3" class="text-center py-4 text-secondary small">
              <i class="bi bi-people fs-4 d-block mb-1 text-secondary"></i>
              هیچ کاربری در پایگاه داده سرور یافت نشد.
            </td>
          </tr>
        `;
        return;
      }

      tbody.innerHTML = users.map((u, index) => {
        const rankNumber = index + 1;
        const rankClass = rankNumber === 1 ? 'rank-top-1' : (rankNumber === 2 ? 'rank-top-2' : (rankNumber === 3 ? 'rank-top-3' : ''));
        const fullName = ((u.firstName || '') + ' ' + (u.lastName || '')).trim() || 'کاربر بدون نام';
        return `
          <tr>
            <td class="col-rank ${rankClass}">${rankNumber}</td>
            <td class="col-name">${fullName}</td>
            <td class="col-score">
              <span class="badge-gold">${u.score || 0} امتیاز</span>
            </td>
          </tr>
        `;
      }).join('');
    }

    function filterUsers() {
      const q = document.getElementById('userSearchInput').value.trim().toLowerCase();
      if (!q) {
        renderUsers(cachedUsers);
        return;
      }
      const filtered = cachedUsers.filter(u => {
        const fullName = ((u.firstName || '') + ' ' + (u.lastName || '')).toLowerCase();
        return fullName.includes(q);
      });
      renderUsers(filtered);
    }

    // Direct initial load
    loadUsers();

    // Auto-refresh every 12 seconds with live data
    setInterval(loadUsers, 12000);
  </script>
</body>
</html>
