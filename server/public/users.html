<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>فهرست کاربران واقعی | رقابت کن، جایزه ببر</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background-color: #0B192C;
      color: #F8FAFC;
      min-height: 100vh;
      margin: 0;
      padding: 0;
    }
    .card {
      background-color: #1E3E62;
      border: 1px solid #2E5077;
      border-radius: 16px;
      color: #fff;
      box-shadow: 0 4px 16px rgba(0,0,0,0.3);
    }
    .gold-text {
      color: #FFB703;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .badge-gold {
      background: linear-gradient(135deg, #FFB703, #FB8500);
      color: #0B192C;
      font-weight: 800;
      padding: 6px 14px;
      border-radius: 20px;
    }
    .table-dark {
      background-color: #152A44;
    }
    .form-control-dark {
      background-color: #152A44;
      border: 1px solid #2E5077;
      color: #fff;
    }
    .form-control-dark:focus {
      background-color: #1E3E62;
      border-color: #FFB703;
      color: #fff;
      box-shadow: 0 0 0 0.25rem rgba(255,183,3,0.25);
    }
    .form-control-dark::placeholder {
      color: #94A3B8;
    }
    .btn-gold {
      background: linear-gradient(135deg, #FFB703, #FB8500);
      color: #0B192C;
      font-weight: bold;
      border: none;
    }
    .btn-gold:hover {
      background: linear-gradient(135deg, #FB8500, #FFB703);
      color: #0B192C;
    }
    .user-id-badge {
      background-color: #0B192C;
      border: 1px solid #2E5077;
      color: #FFB703;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.9rem;
      letter-spacing: 0.5px;
    }
    .row-index {
      color: #94A3B8;
      font-weight: 700;
      font-size: 0.95rem;
    }
    /* Auth Modal Overlay */
    .auth-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(11, 25, 44, 0.88);
      backdrop-filter: blur(6px);
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
  </style>
</head>
<body>

  <!-- Clean Main Page Content -->
  <main class="container-fluid px-3 px-md-4 max-w-7xl py-4">
    <!-- Header with Title and Search only -->
    <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-3">
      <h2 class="gold-text mb-0">
        <i class="bi bi-trophy-fill text-warning me-2"></i>فهرست کاربران واقعی
      </h2>
      <div class="d-flex align-items-center gap-2">
        <input type="text" id="userSearchInput" class="form-control form-control-dark" style="min-width: 260px;" placeholder="جستجو بر اساس نام یا شناسه..." onkeyup="filterUsers()">
      </div>
    </div>

    <!-- Users Table Card -->
    <div class="card p-3 p-md-4">
      <div class="table-responsive">
        <table class="table table-dark table-hover table-striped rounded align-middle mb-0">
          <thead>
            <tr class="text-secondary border-secondary">
              <th scope="col" style="width: 110px;">شماره ردیف</th>
              <th scope="col" style="min-width: 150px;">شناسه کاربر</th>
              <th scope="col">نام و نام خانوادگی</th>
              <th scope="col" style="min-width: 150px;">مجموع امتیاز</th>
            </tr>
          </thead>
          <tbody id="usersTbody">
            <tr>
              <td colspan="4" class="text-center py-5 text-secondary">
                <span class="spinner-border spinner-border-sm me-2 text-warning" role="status"></span>
                در حال دریافت اطلاعات از سرور...
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- Clean Security Dialog (Only shown if key is missing or invalid) -->
  <div id="authModal" class="auth-overlay d-none">
    <div class="card p-4" style="max-width: 420px; width: 100%; border-color: #FFB703;">
      <div class="text-center mb-3">
        <div class="mb-2">
          <i class="bi bi-shield-lock-fill text-warning" style="font-size: 2.5rem;"></i>
        </div>
        <h5 class="gold-text mb-1">احراز هویت مدیر</h5>
        <p class="text-secondary small mb-0">برای مشاهده فهرست کاربران و مجموع امتیازها، کلید امنیتی مدیریت را وارد کنید:</p>
      </div>

      <form onsubmit="event.preventDefault(); submitAuthKey();">
        <div class="mb-3">
          <input type="password" id="modalKeyInput" class="form-control form-control-dark py-2 text-center" placeholder="کلید مدیریت (ADMIN_KEY)..." autocomplete="current-password" autofocus>
          <div id="modalErrorMsg" class="text-danger small mt-2 text-center d-none"></div>
        </div>
        <button type="submit" id="modalSubmitBtn" class="btn btn-gold w-100 py-2">
          <span id="modalSpinner" class="spinner-border spinner-border-sm me-1 d-none" role="status"></span>
          ورود به فهرست کاربران
        </button>
      </form>
    </div>
  </div>

  <script>
    let cachedUsers = [];

    // Check if key is provided in URL query (?key=... or ?adminKey=...)
    (function handleUrlKey() {
      try {
        const params = new URLSearchParams(window.location.search);
        const urlKey = params.get('key') || params.get('adminKey');
        if (urlKey && urlKey.trim()) {
          localStorage.setItem('reqabat_admin_key', urlKey.trim());
          // Remove key from URL for security without reloading
          const cleanUrl = window.location.pathname;
          window.history.replaceState({}, document.title, cleanUrl);
        }
      } catch (e) {
        console.error('URL parse error:', e);
      }
    })();

    function getAdminKey() {
      return (localStorage.getItem('reqabat_admin_key') || '').trim();
    }

    function showAuthModal(errorText) {
      const modal = document.getElementById('authModal');
      const errBox = document.getElementById('modalErrorMsg');
      modal.classList.remove('d-none');
      if (errorText) {
        errBox.innerText = errorText;
        errBox.classList.remove('d-none');
      } else {
        errBox.classList.add('d-none');
      }
      setTimeout(() => {
        const inp = document.getElementById('modalKeyInput');
        if (inp) inp.focus();
      }, 100);
    }

    function hideAuthModal() {
      document.getElementById('authModal').classList.add('d-none');
      document.getElementById('modalErrorMsg').classList.add('d-none');
    }

    async function submitAuthKey() {
      const inp = document.getElementById('modalKeyInput');
      const btn = document.getElementById('modalSubmitBtn');
      const spinner = document.getElementById('modalSpinner');
      const key = (inp.value || '').trim();

      if (!key) {
        const errBox = document.getElementById('modalErrorMsg');
        errBox.innerText = 'لطفاً کلید مدیریت را وارد کنید.';
        errBox.classList.remove('d-none');
        return;
      }

      btn.disabled = true;
      spinner.classList.remove('d-none');

      localStorage.setItem('reqabat_admin_key', key);
      const success = await loadUsers();

      btn.disabled = false;
      spinner.classList.add('d-none');

      if (success) {
        hideAuthModal();
      } else {
        const errBox = document.getElementById('modalErrorMsg');
        errBox.innerText = 'کلید مدیریت وارد شده نامعتبر است.';
        errBox.classList.remove('d-none');
      }
    }

    function sortUsersList(list) {
      return list.sort((a, b) => {
        const scoreA = Number(a.score) || 0;
        const scoreB = Number(b.score) || 0;
        if (scoreB !== scoreA) {
          return scoreB - scoreA;
        }
        const timeA = typeof a.registeredAt === 'number' ? a.registeredAt : (new Date(a.registeredAt || 0).getTime() || 0);
        const timeB = typeof b.registeredAt === 'number' ? b.registeredAt : (new Date(b.registeredAt || 0).getTime() || 0);
        if (timeA !== timeB) {
          return timeA - timeB;
        }
        return String(a.id || '').localeCompare(String(b.id || ''));
      });
    }

    async function loadUsers() {
      const key = getAdminKey();

      if (!key) {
        showAuthModal();
        return false;
      }

      try {
        const res = await fetch('/api/admin/users', {
          headers: {
            'x-admin-key': key
          }
        });

        if (res.status === 401) {
          showAuthModal('کلید مدیریت منقضی یا نامعتبر است.');
          return false;
        }

        if (!res.ok) {
          throw new Error('خطا در ارتباط با سرور (کد ' + res.status + ')');
        }

        const data = await res.json();
        hideAuthModal();

        // Sort descending by total score
        cachedUsers = sortUsersList(data.users || []);
        renderUsers(cachedUsers);
        return true;

      } catch (err) {
        console.error('Error loading users:', err);
        return false;
      }
    }

    function renderUsers(users) {
      const tbody = document.getElementById('usersTbody');
      if (!users || users.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="4" class="text-center py-5 text-secondary">
              <i class="bi bi-people fs-2 d-block mb-2 text-secondary"></i>
              هیچ کاربری در پایگاه داده سرور یافت نشد.
            </td>
          </tr>
        `;
        return;
      }

      tbody.innerHTML = users.map((u, index) => {
        const fullName = ((u.firstName || '') + ' ' + (u.lastName || '')).trim() || 'کاربر بدون نام';
        return `
          <tr>
            <td><span class="row-index">${index + 1}</span></td>
            <td><code class="user-id-badge">${u.id || '-'}</code></td>
            <td class="fw-bold">${fullName}</td>
            <td>
              <span class="badge badge-gold fs-6">${u.score || 0} امتیاز</span>
            </td>
          </tr>
        `;
      }).join('');
    }

    function filterUsers() {
      const q = document.getElementById('userSearchInput').value.trim().toLowerCase();
      if (!q) {
        renderUsers(cachedUsers);
        return;
      }
      const filtered = cachedUsers.filter(u => {
        const fullName = ((u.firstName || '') + ' ' + (u.lastName || '')).toLowerCase();
        const id = (u.id || '').toLowerCase();
        return fullName.includes(q) || id.includes(q);
      });
      // Renders filtered results re-numbering row numbers from 1
      renderUsers(filtered);
    }

    // Initial load
    loadUsers();

    // Auto-refresh every 12 seconds with real data
    setInterval(loadUsers, 12000);
  </script>
</body>
</html>
